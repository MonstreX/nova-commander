[package]
name = "nc-plugin-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Safe Rust for nova-commander plugins"

[dependencies]
nc-plugin-api = { path = "../nc-plugin-api" }

[target.'cfg(windows)'.dependencies]
# The system's calls FAR's plugins make, as safe wrappers (owner, ADR-0016 addendum P6.0e).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_Globalization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Wdk_System_SystemInformation", "Wdk_System_Threading", "Win32_Security_Authorization", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_System_Time", "Win32_System_SystemInformation", "Wdk_Foundation", "Win32_System_Services", "Win32_NetworkManagement_WNet", "Win32_NetworkManagement_NetManagement", "Win32_System_WindowsProgramming", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.27.0"
