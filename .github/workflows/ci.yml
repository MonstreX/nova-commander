name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # The runner's own temporary folder is a short 8.3 name (C:\Users\RUNNER~1\...), which the tests'
      # folders do not expect; the job's own one has a long name.
      - name: Long temporary folder
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      # The version the project is built and checked with; newer clippy lints are taken up deliberately.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The plugins' tests load the plugins laid out beside the debug program.
      - name: Plugins beside the program
        run: cargo run -p xtask -- package target/debug
      - name: Tests
        run: cargo test --workspace
