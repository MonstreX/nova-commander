name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # The runner's own temporary folder is a short 8.3 name (C:\Users\RUNNER~1\...), which the tests'
      # folders do not expect; the job's own one has a long name.
      - name: Long temporary folder
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      # The version the project is built and checked with; newer clippy lints are taken up deliberately.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The plugins' tests load the plugins laid out beside the debug program.
      - name: Plugins beside the program
        run: cargo run -p xtask -- package target/debug
      # Three tests check the developer's machine, not the code, and run there with every commit: a
      # system disk that is not removable (some Azure machines mark their NVMe disk removable) and a
      # volume without last-access updates (the runner's has them; the watch takes them, as FAR's).
      - name: Tests
        run: >-
          cargo test --workspace --
          --skip app::drive_actions::tests::del_ins_and_shift_del_leave_a_fixed_disk_alone
          --skip platform::windows::hotplug::tests::the_system_disk_is_found_and_is_no_hotplug_device
          --skip platform::windows::watch::tests::a_change_in_a_subfolder_is_not_the_folder_s
